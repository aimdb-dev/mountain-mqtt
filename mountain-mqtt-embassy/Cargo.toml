[package]
# Published fork of `mountain-mqtt-embassy`. The prefix is load-bearing: this
# fork adds API that aimdb calls (`ConnectionSettings::authenticated`) and moves
# the embassy dependencies to 0.9/0.8/0.5.1, while crates.io
# `mountain-mqtt-embassy 0.2.0` has neither. Publishing anything that resolved
# to that version would not compile.
name = "aimdb-mountain-mqtt-embassy"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["mqtt", "embassy"]
categories = [
  "asynchronous",
  "embedded",
  "network-programming",
  "no-std::no-alloc",
  "encoding",
]
description = "A no_std compatible, async MQTT v5 client for embassy, using mountain-mqtt (aimdb-dev fork)"
repository = "https://github.com/aimdb-dev/mountain-mqtt"
readme = "README.md"

[dependencies]
embassy-net = { version = "0.9.0", features = [
  "defmt",
  "tcp",
  "udp",
  "raw",
  "dhcpv4",
  "medium-ethernet",
  "dns",
] }

embassy-sync = { version = "0.8.0", features = ["defmt"] }

embassy-time = { version = "0.5.1", features = [
  "defmt",
  "defmt-timestamp-uptime",
] }

defmt = { version = "1.0", optional = true }

# Keyed `mountain-mqtt` so `use mountain_mqtt::…` in this crate is unchanged;
# `package` selects the renamed fork.
mountain-mqtt = { package = "aimdb-mountain-mqtt", version = "0.2.1", path = "../mountain-mqtt", default-features = false, features = [
  "embedded-io-async",
  "embedded-hal-async",
  "defmt",
] }

[features]
default = ["defmt"]
defmt = ["dep:defmt"]
