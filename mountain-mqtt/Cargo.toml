[package]
# Published fork of `mountain-mqtt`, tracking upstream `main` with a ZERO-LINE
# source delta
name = "aimdb-mountain-mqtt"
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["mqtt", "tokio", "embedded-hal-async"]
categories = [
  "asynchronous",
  "embedded",
  "network-programming",
  "no-std::no-alloc",
  "encoding",
]
description = "A no_std compatible, async MQTT v5 client for tokio and embedded use (aimdb-dev fork of mountain-mqtt)"
repository = "https://github.com/aimdb-dev/mountain-mqtt"
readme = "README.md"

# The package is renamed but the *library* is not, so upstream's own tests and
# examples (`use mountain_mqtt::…`) compile unchanged and `cargo publish` can
# verify normally. Downstreams keying the dependency as `mountain-mqtt` with
# `package = "aimdb-mountain-mqtt"` are unaffected either way.
[lib]
name = "mountain_mqtt"

[dependencies]
heapless = "0.8"

embedded-io = { version = "0.7", optional = true }
embedded-io-async = { version = "0.7", optional = true }

embedded-hal-async = { version = "1.0", optional = true }
defmt = { version = "1.1", optional = true }

tokio = { version = "1", features = ["full"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-hal-async = "1.0"
tokio-test = { version = "0.4.2" }

[features]
default = ["tokio", "embedded-io-async", "embedded-hal-async", "defmt"]
tokio = ["dep:tokio", "std"]
defmt = ["dep:defmt"]
embedded-io-async = ["dep:embedded-io-async", "dep:embedded-io"]
embedded-hal-async = ["dep:embedded-hal-async"]
std = []
